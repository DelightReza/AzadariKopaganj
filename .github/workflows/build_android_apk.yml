name: Build Signed Android APK (Capacitor)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App Version Name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
      version_code:
        description: "App Version Code (integer, e.g. 1)"
        required: false
        default: "1"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "android-native/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"
      - "configure_android_app.py"
      - ".github/workflows/build_android_apk.yml"

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DelightReza/AzadariKopaganj
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & Pillow for Adaptive Icon Generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for Android Adaptive Launcher Icons
        run: pip install --upgrade pip pillow

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies & build production web bundle
        run: |
          npm install
          npm run build

      - name: Add or sync Capacitor Android platform (com.azadari.kopaganj)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode & Validate Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: ANDROID_KEYSTORE_BASE64 secret is missing in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Error: ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/azadarikopaganj-release.jks"
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > "$KEYSTORE_PATH"

          # Verify the keystore file and alias are valid before building
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"

      - name: Apply App Name (Azadari Kopaganj), Package (com.azadari.kopaganj) & Adaptive Logo
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number || '1' }}
        run: python3 configure_android_app.py

      - name: Assemble Release APK & AAB via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Zipalign, Sign with apksigner (V1/V2/V3) & Verify Signature
        run: |
          set -euo pipefail
          mkdir -p dist-apk

          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          RAW_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -z "$RAW_APK" ]; then
            echo "Error: Release APK was not generated by Gradle!"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "Using build-tools from: $BUILD_TOOLS_DIR"

          # 1. 4-byte page-align the APK
          "$ZIPALIGN" -p -f -v 4 "$RAW_APK" "dist-apk/aligned.apk" > /dev/null

          # 2. Explicitly sign with apksigner (V1 + V2 + V3 enabled, V4 disabled for standalone APK installation)
          "$APKSIGNER" sign \
            --ks "$RELEASE_STORE_FILE" \
            --ks-pass "pass:${RELEASE_STORE_PASSWORD}" \
            --ks-key-alias "${RELEASE_KEY_ALIAS}" \
            --key-pass "pass:${RELEASE_KEY_PASSWORD}" \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "dist-apk/Azadari-Kopaganj.apk" \
            "dist-apk/aligned.apk"

          rm -f "dist-apk/aligned.apk"

          # 3. Verify APK signature and print certificate digests (fails the build if unsigned or invalid)
          echo "Verifying signed APK certificate..."
          "$APKSIGNER" verify --verbose --print-certs "dist-apk/Azadari-Kopaganj.apk"

          # 4. Sign AAB bundle if present
          if [ -n "$RAW_AAB" ]; then
            cp "$RAW_AAB" "dist-apk/Azadari-Kopaganj.aab"
            jarsigner -keystore "$RELEASE_STORE_FILE" \
              -storepass "${RELEASE_STORE_PASSWORD}" \
              -keypass "${RELEASE_KEY_PASSWORD}" \
              "dist-apk/Azadari-Kopaganj.aab" "${RELEASE_KEY_ALIAS}"
          fi

      - name: Upload Signed Azadari Kopaganj APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azadari-Kopaganj-signed-apk
          path: |
            dist-apk/Azadari-Kopaganj.apk
            dist-apk/Azadari-Kopaganj.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name || '1.0.0' }}
          name: "Azadari Kopaganj v${{ github.event.inputs.version_name || '1.0.0' }}"
          body: |
            Official signed Android release for **Azadari Kopaganj** (`com.azadari.kopaganj`).
          files: |
            dist-apk/Azadari-Kopaganj.apk
            dist-apk/Azadari-Kopaganj.aab
          prerelease: false
