name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DelightReza/AzadariKopaganj
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Add or sync Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Assemble Debug APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload AzadariKopaganj APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzadariKopaganj-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
