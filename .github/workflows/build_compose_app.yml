name: Build Native Kotlin Compose App

on:
  workflow_dispatch:
  push:
    branches:
      - app
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build_compose_app.yml"

permissions:
  contents: write

jobs:
  build-compose-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azadari-Kopaganj-Compose-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
