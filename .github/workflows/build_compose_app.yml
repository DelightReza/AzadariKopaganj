name: Build Native Kotlin Compose App

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version name"
        required: false
        default: "1.0.0"
      version_code:
        description: "App version code"
        required: false
        default: "1"
  push:
    branches:
      - app
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build_compose_app.yml"

permissions:
  contents: write

jobs:
  build-compose-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode and validate release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          KEYSTORE_PATH="$RUNNER_TEMP/Azadari-Kopaganj.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          INPUT_VERSION_CODE: ${{ inputs.version_code || '1' }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="$INPUT_VERSION_NAME" \
            -PversionCode="$INPUT_VERSION_CODE" \
            --no-daemon

      - name: Align and verify signed APK
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          mkdir -p dist-apk
          "$ZIPALIGN" -p -f 4 "$RAW_APK" "dist-apk/Azadari-Kopaganj-$INPUT_VERSION_NAME.apk"
          "$APKSIGNER" verify --verbose --print-certs "dist-apk/Azadari-Kopaganj-$INPUT_VERSION_NAME.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Azadari-Kopaganj-Compose-signed
          path: dist-apk/Azadari-Kopaganj-*.apk
          if-no-files-found: error
