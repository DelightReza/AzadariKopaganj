name: Deploy Azadari Kopaganj & Signed APK to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Update Azadari Kopaganj YouTube Feed & Manifests"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for Android Adaptive Launcher Icons
        run: pip install --upgrade pip pillow

      - name: Sync latest YouTube RSS & live stream manifests
        run: python3 update_feed.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build static web bundle (dist/ + config.json + assets/)
        run: npm run build

      - name: Add or sync Capacitor Android platform (com.azadari.kopaganj)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Release Keystore (From GitHub Secrets or Auto-Generated)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/azadarikopaganj-release.jks"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASS="${KEYSTORE_PASSWORD}"
            ALIAS_NAME="${KEY_ALIAS}"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            STORE_PASS="AzadariKopaganj@786"
            ALIAS_NAME="azadarikopaganj"
            KEY_PASS="AzadariKopaganj@786"

            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$ALIAS_NAME" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Azadari Kopaganj, OU=Media, O=AzadariKopaganj, L=Kopaganj, ST=Uttar Pradesh, C=IN"
          fi

          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Configure Azadari Kopaganj (com.azadari.kopaganj) & Adaptive Logo
        env:
          INPUT_VERSION_NAME: "1.0.0"
          INPUT_VERSION_CODE: ${{ github.run_number || '1' }}
        run: python3 configure_android_app.py

      - name: Assemble Signed Release APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage Signed APK into GitHub Pages dist/
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "dist/Azadari Kopaganj.apk"
            cp "$APK_PATH" "dist/Azadari-Kopaganj.apk"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
